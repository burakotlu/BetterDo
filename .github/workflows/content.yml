name: Lesson catalog checks
on:
  push:
    branches: [main]
    paths: ['content/**', 'scripts/**', 'tests/**', '.github/workflows/content.yml']
  pull_request:
    paths: ['content/**', 'scripts/**', 'tests/**', '.github/workflows/content.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/validate_content.py
      - run: python3 -m unittest discover -s tests -v
