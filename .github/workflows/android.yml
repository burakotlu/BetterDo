name: Android checks and APK

on:
  push:
    branches: [main]
    paths-ignore: ['content/**']
  pull_request:
    paths-ignore: ['content/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate remote catalog and content agent
        run: |
          python3 scripts/validate_content.py
          python3 -m unittest discover -s tests -v
      - name: Build and test Android
        run: bash ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - name: Ensure lessons are not bundled in the application
        run: |
          python3 -c "import zipfile; z=zipfile.ZipFile('app/build/outputs/apk/debug/app-debug.apk'); assert 'assets/lessons.json' not in z.namelist()"
      - uses: actions/upload-artifact@v4
        with:
          name: BetterDo-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html

  device-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: build
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            status=0; bash ./gradlew connectedDebugAndroidTest || status=$?; adb pull /sdcard/Download/betterdo-screenshots app/build/reports/screenshots || true; exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-device-reports
          path: |
            app/build/reports/androidTests/
            app/build/reports/screenshots/
